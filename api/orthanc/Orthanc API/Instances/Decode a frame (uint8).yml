info:
  name: Decode a frame (uint8)
  type: http
  seq: 26
  tags:
    - Instances

http:
  method: GET
  url: "{{baseUrl}}/instances/:id/frames/:frame/image-uint8"
  headers:
    - name: Accept
      value: ""
      description: Format of the resulting image. Can be `image/png` (default), `image/jpeg` or `image/x-portable-arbitrarymap`
      disabled: true
  params:
    - name: quality
      value: ""
      type: query
      description: Quality for JPEG images (between 1 and 100, defaults to 90)
      disabled: true
    - name: returnUnsupportedImage
      value: ""
      type: query
      description: Returns an unsupported.png placeholder image if unable to provide the image instead of returning a 415 HTTP error (value is true if option is present)
      disabled: true
    - name: frame
      value: ""
      type: path
      description: Index of the frame (starts at `0`)
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the DICOM instance of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Decode one frame of interest from the given DICOM instance. Pixels of grayscale images are truncated to the [0,255] range.
