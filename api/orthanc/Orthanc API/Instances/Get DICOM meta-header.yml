info:
  name: Get DICOM meta-header
  type: http
  seq: 33
  tags:
    - Instances

http:
  method: GET
  url: "{{baseUrl}}/instances/:id/header"
  params:
    - name: short
      value: ""
      type: query
      description: If present, report the DICOM tags in hexadecimal format
      disabled: true
    - name: simplify
      value: ""
      type: query
      description: If present, report the DICOM tags in human-readable format (using the symbolic name of the tags)
      disabled: true
    - name: id
      value: 0061643a-2100f3a1-8e27c951-43911b9d-7f75b080
      type: path
      description: Orthanc identifier of the DICOM instance of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/instances/:id/header"
      method: GET
      params:
        - name: short
          value: ""
          type: query
          description: If present, report the DICOM tags in hexadecimal format
          disabled: true
        - name: simplify
          value: ""
          type: query
          description: If present, report the DICOM tags in human-readable format (using the symbolic name of the tags)
          disabled: true
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the DICOM instance of interest
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "0002,0000": {
              "Name": "FileMetaInformationGroupLength",
              "Type": "String",
              "Value": "202"
            },
            "0002,0002": {
              "Name": "MediaStorageSOPClassUID",
              "Type": "String",
              "Value": "1.2.840.10008.5.1.4.1.1.2"
            },
            "0002,0003": {
              "Name": "MediaStorageSOPInstanceUID",
              "Type": "String",
              "Value": "1.3.12.2.1107.5.1.4.54693.30000006100507010800000005269"
            },
            "0002,0010": {
              "Name": "TransferSyntaxUID",
              "Type": "String",
              "Value": "1.2.840.10008.1.2.1"
            },
            "0002,0012": {
              "Name": "ImplementationClassUID",
              "Type": "String",
              "Value": "1.3.6.1.4.1.19291.2.1"
            },
            "0002,0013": {
              "Name": "ImplementationVersionName",
              "Type": "String",
              "Value": "OSIRIX001"
            },
            "0002,0016": {
              "Name": "SourceApplicationEntityTitle",
              "Type": "String",
              "Value": "OSIRIX"
            }
          }

docs: Get the DICOM tags in the meta-header of the DICOM instance. By default, the `full` format is used, which combines hexadecimal tags with human-readable description.
