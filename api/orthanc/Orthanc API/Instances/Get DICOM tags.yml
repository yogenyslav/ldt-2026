info:
  name: Get DICOM tags
  type: http
  seq: 58
  tags:
    - Instances

http:
  method: GET
  url: "{{baseUrl}}/instances/:id/tags"
  params:
    - name: ignore-length
      value: "[]"
      type: query
      description: Also include the DICOM tags that are provided in this list, even if their associated value is long
      disabled: true
    - name: short
      value: ""
      type: query
      description: If present, report the DICOM tags in hexadecimal format
      disabled: true
    - name: simplify
      value: ""
      type: query
      description: If present, report the DICOM tags in human-readable format (using the symbolic name of the tags)
      disabled: true
    - name: whole
      value: ""
      type: query
      description: Whether to read the whole DICOM file from the storage area (new in Orthanc 1.12.4). If set to "false" (default value), the DICOM file is read until the pixel data tag (7fe0,0010) to optimize access to storage. Setting the option to "true" provides access to the DICOM tags stored after the pixel data tag.
      disabled: true
    - name: id
      value: fd6cea7e-d5063543-e9d9bab9-129be445-8927826f
      type: path
      description: Orthanc identifier of the DICOM instance of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/instances/:id/tags"
      method: GET
      params:
        - name: ignore-length
          value: "[]"
          type: query
          description: Also include the DICOM tags that are provided in this list, even if their associated value is long
