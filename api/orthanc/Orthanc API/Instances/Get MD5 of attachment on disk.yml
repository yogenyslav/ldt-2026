info:
  name: Get MD5 of attachment on disk
  type: http
  seq: 11
  tags:
    - Instances

http:
  method: GET
  url: "{{baseUrl}}/instances/:id/attachments/:name/compressed-md5"
  headers:
    - name: If-None-Match
      value: ""
      description: Optional revision of the attachment, to check if its content has changed
      disabled: true
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the instance of interest
    - name: name
      value: ""
      type: path
      description: The name of the attachment, or its index (cf. `UserContentType` configuration option)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Get the MD5 hash of one attachment associated with the given instance, as stored on the disk. This is different from `.../md5` iff `EnableStorage` is `true`.
