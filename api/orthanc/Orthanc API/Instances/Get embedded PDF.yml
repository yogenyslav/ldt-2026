info:
  name: Get embedded PDF
  type: http
  seq: 50
  tags:
    - Instances

http:
  method: GET
  url: "{{baseUrl}}/instances/:id/pdf"
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the instance interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Get the PDF file that is embedded in one DICOM instance. If the DICOM instance doesn't contain the `EncapsulatedDocument` tag or if the `MIMETypeOfEncapsulatedDocument` tag doesn't correspond to the PDF type, a `404` HTTP error is raised.
