info:
  name: Get instance statistics
  type: http
  seq: 56
  tags:
    - Instances

http:
  method: GET
  url: "{{baseUrl}}/instances/:id/statistics"
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the instance of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/instances/:id/statistics"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the instance of interest
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "DicomDiskSize": "368852",
            "DicomDiskSizeMB": 0,
            "DicomUncompressedSize": "368852",
            "DicomUncompressedSizeMB": 0,
            "DiskSize": "368852",
            "DiskSizeMB": 0,
            "UncompressedSize": "368852",
            "UncompressedSizeMB": 0
          }

