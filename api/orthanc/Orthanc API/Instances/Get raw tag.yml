info:
  name: Get raw tag
  type: http
  seq: 20
  tags:
    - Instances

http:
  method: GET
  url: "{{baseUrl}}/instances/:id/content/:path"
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the DICOM instance of interest
    - name: path
      value: ""
      type: path
      description: Path to the DICOM tag. This is the interleaving of one DICOM tag, possibly followed by an index for sequences. Sequences are accessible as, for instance, `/0008-1140/1/0008-1150`
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Get the raw content of one DICOM tag in the hierarchy of DICOM dataset
