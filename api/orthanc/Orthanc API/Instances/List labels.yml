info:
  name: List labels
  type: http
  seq: 37
  tags:
    - Instances

http:
  method: GET
  url: "{{baseUrl}}/instances/:id/labels"
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the instance of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/instances/:id/labels"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the instance of interest
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "[]"

docs: Get the labels that are associated with the given instance (new in Orthanc 1.12.0)
