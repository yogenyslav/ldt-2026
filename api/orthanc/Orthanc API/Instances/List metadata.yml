info:
  name: List metadata
  type: http
  seq: 42
  tags:
    - Instances

http:
  method: GET
  url: "{{baseUrl}}/instances/:id/metadata?expand="
  params:
    - name: expand
      value: ""
      type: query
      description: If present, also retrieve the value of the individual metadata
    - name: numeric
      value: ""
      type: query
      description: If present, use the numeric identifier of the metadata instead of its symbolic name
      disabled: true
    - name: id
      value: fd6cea7e-d5063543-e9d9bab9-129be445-8927826f
      type: path
      description: Orthanc identifier of the instance of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/instances/:id/metadata"
      method: GET
      params:
        - name: expand
          value: ""
          type: query
          description: If present, also retrieve the value of the individual metadata
          disabled: true
        - name: numeric
          value: ""
          type: query
          description: If present, use the numeric identifier of the metadata instead of its symbolic name
          disabled: true
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the instance of interest
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            "IndexInSeries",
            "ReceptionDate",
            "RemoteAET",
            "Origin",
            "TransferSyntax",
            "SopClassUid",
            "RemoteIP",
            "HttpUsername",
            "PixelDataOffset",
            "MainDicomTagsSignature",
            "4202"
          ]

docs: Get the list of metadata that are associated with the given instance
