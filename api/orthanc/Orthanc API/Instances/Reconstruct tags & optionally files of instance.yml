info:
  name: Reconstruct tags & optionally files of instance
  type: http
  seq: 52
  tags:
    - Instances

http:
  method: POST
  url: "{{baseUrl}}/instances/:id/reconstruct"
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the instance of interest
  body:
    type: json
    data: |-
      {
        "LimitToThisLevelMainDicomTags": false,
        "ReconstructFiles": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/instances/:id/reconstruct"
      method: POST
      params:
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the instance of interest
      body:
        type: json
        data: |-
          {
            "LimitToThisLevelMainDicomTags": false,
            "ReconstructFiles": false
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: Reconstruct the main DICOM tags in DB of the instance whose Orthanc identifier is provided in the URL. This is useful if child studies/series/instances have inconsistent values for higher-level tags, in order to force Orthanc to use the value from the resource of interest. Beware that this is a time-consuming operation, as all the children DICOM instances will be parsed again, and the Orthanc index will be updated accordingly.
