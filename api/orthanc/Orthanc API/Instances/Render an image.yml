info:
  name: Render an image
  type: http
  seq: 53
  tags:
    - Instances

http:
  method: GET
  url: "{{baseUrl}}/instances/:id/rendered"
  headers:
    - name: Accept
      value: ""
      description: Format of the resulting image. Can be `image/png` (default), `image/jpeg` or `image/x-portable-arbitrarymap`
      disabled: true
  params:
    - name: height
      value: ""
      type: query
      description: Height of the resized image
      disabled: true
    - name: quality
      value: ""
      type: query
      description: Quality for JPEG images (between 1 and 100, defaults to 90)
      disabled: true
    - name: returnUnsupportedImage
      value: ""
      type: query
      description: Returns an unsupported.png placeholder image if unable to provide the image instead of returning a 415 HTTP error (value is true if option is present)
      disabled: true
    - name: smooth
      value: ""
      type: query
      description: Whether to smooth image on resize
      disabled: true
    - name: width
      value: ""
      type: query
      description: Width of the resized image
      disabled: true
    - name: window-center
      value: ""
      type: query
      description: Windowing center
      disabled: true
    - name: window-width
      value: ""
      type: query
      description: Windowing width
      disabled: true
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the DICOM instance of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Render the first frame of the given DICOM instance. This function takes scaling into account (`RescaleSlope` and `RescaleIntercept` tags), as well as the default windowing stored in the DICOM file (`WindowCenter` and `WindowWidth`tags), and can be used to resize the resulting image. Color images are not affected by windowing.
