info:
  name: Write DICOM onto filesystem
  type: http
  seq: 21
  tags:
    - Instances

http:
  method: POST
  url: "{{baseUrl}}/instances/:id/export"
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the DICOM instance of interest
  body:
    type: text
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/instances/:id/export"
      method: POST
      params:
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the DICOM instance of interest
      body:
        type: text
        data: ""
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: Write the DICOM file onto the filesystem where Orthanc is running.  This is insecure for Orthanc servers that are remotely accessible since one could overwrite any system file.  Since Orthanc 1.12.0, this route is disabled by default, but can be enabled using the `RestApiWriteToFileSystemEnabled` configuration option.
