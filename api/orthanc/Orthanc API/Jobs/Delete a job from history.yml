info:
  name: Delete a job from history
  type: http
  seq: 2
  tags:
    - Jobs

http:
  method: DELETE
  url: "{{baseUrl}}/jobs/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the job of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/jobs/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
          description: Identifier of the job of interest
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: "Delete the job from the jobs history.  Only a completed job can be deleted. If the job has not run or not completed yet, you must cancel it first. If the job has outputs, all outputs will be deleted as well. "
