info:
  name: Delete a job output
  type: http
  seq: 8
  tags:
    - Jobs

http:
  method: DELETE
  url: "{{baseUrl}}/jobs/:id/:key"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the job of interest
    - name: key
      value: ""
      type: path
      description: Name of the output of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/jobs/:id/:key"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
          description: Identifier of the job of interest
        - name: key
          value: ""
          type: path
          description: Name of the output of interest
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: Delete the output produced by a job. As of Orthanc 1.12.1, only the jobs that generate a DICOMDIR media or a ZIP archive provide such an output (with `key` equals to `archive`).
