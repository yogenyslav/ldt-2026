info:
  name: Get job output
  type: http
  seq: 9
  tags:
    - Jobs

http:
  method: GET
  url: "{{baseUrl}}/jobs/:id/:key"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the job of interest
    - name: key
      value: ""
      type: path
      description: Name of the output of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieve some output produced by a job. As of Orthanc 1.8.2, only the jobs that generate a DICOMDIR media or a ZIP archive provide such an output (with `key` equals to `archive`).
