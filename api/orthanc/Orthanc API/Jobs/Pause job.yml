info:
  name: Pause job
  type: http
  seq: 5
  tags:
    - Jobs

http:
  method: POST
  url: "{{baseUrl}}/jobs/:id/pause"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the job of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Pause the job whose identifier is provided in the URL. Check out the Orthanc Book for more information about the state machine applicable to jobs: https://orthanc.uclouvain.be/book/users/advanced-rest.html#jobs"
