info:
  name: Delete DICOM modality
  type: http
  seq: 2
  tags:
    - Networking

http:
  method: DELETE
  url: "{{baseUrl}}/modalities/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the DICOM modality of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/modalities/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
          description: Identifier of the DICOM modality of interest
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: Delete one DICOM modality. This change is permanent iff. `DicomModalitiesInDatabase` is `true`, otherwise it is lost at the next restart of Orthanc.
