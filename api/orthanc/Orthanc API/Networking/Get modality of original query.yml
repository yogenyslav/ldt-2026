http:
  method: GET
  url: "{{baseUrl}}/queries/:id/modality"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the query of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
