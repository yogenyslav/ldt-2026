info:
  name: Get original query arguments
  type: http
  seq: 39
  tags:
    - Networking

http:
  method: GET
  url: "{{baseUrl}}/queries/:id/query"
  params:
    - name: short
      value: ""
      type: query
      description: If present, report the DICOM tags in hexadecimal format
      disabled: true
    - name: simplify
      value: ""
      type: query
      description: If present, report the DICOM tags in human-readable format (using the symbolic name of the tags)
      disabled: true
    - name: id
      value: ""
      type: path
      description: Identifier of the query of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Get the original DICOM filter associated with the query/retrieve operation whose identifier is provided in the URL
