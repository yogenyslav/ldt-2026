info:
  name: List Orthanc peers
  type: http
  seq: 19
  tags:
    - Networking

http:
  method: GET
  url: "{{baseUrl}}/peers"
  params:
    - name: expand
      value: ""
      type: query
      description: If present, retrieve detailed information about the individual Orthanc peers
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: List all the Orthanc peers that are known to Orthanc. This corresponds either to the content of the `OrthancPeers` configuration option, or to the information stored in the database if `OrthancPeersInDatabase` is `true`.
