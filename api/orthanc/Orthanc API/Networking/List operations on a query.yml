info:
  name: List operations on a query
  type: http
  seq: 29
  tags:
    - Networking

http:
  method: GET
  url: "{{baseUrl}}/queries/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the query of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: List the available operations for the query/retrieve operation whose identifier is provided in the URL
