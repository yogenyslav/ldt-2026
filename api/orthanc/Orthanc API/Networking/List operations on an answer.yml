info:
  name: List operations on an answer
  type: http
  seq: 31
  tags:
    - Networking

http:
  method: GET
  url: "{{baseUrl}}/queries/:id/answers/:index"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the query of interest
    - name: index
      value: ""
      type: path
      description: Index of the answer
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: List the available operations on an answer associated with the query/retrieve operation whose identifier is provided in the URL
