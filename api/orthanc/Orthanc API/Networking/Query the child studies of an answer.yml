info:
  name: Query the child studies of an answer
  type: http
  seq: 35
  tags:
    - Networking

http:
  method: POST
  url: "{{baseUrl}}/queries/:id/answers/:index/query-studies"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the query of interest
    - name: index
      value: ""
      type: path
      description: Index of the answer
  body:
    type: json
    data: |-
      {
        "Query": {},
        "Timeout": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Issue a second DICOM C-FIND operation, in order to query the child studies associated with one answer to some query/retrieve operation whose identifiers are provided in the URL
