info:
  name: Remove after storage commitment
  type: http
  seq: 42
  tags:
    - Networking

http:
  method: POST
  url: "{{baseUrl}}/storage-commitment/:id/remove"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the storage commitment report
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/storage-commitment/:id/remove"
      method: POST
      params:
        - name: id
          value: ""
          type: path
          description: Identifier of the storage commitment report
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: Remove out of Orthanc, the DICOM instances that have been reported to have been properly received in the storage commitment report whose identifier is provided in the URL. This is only possible if the `Status` of the storage commitment report is `Success`. https://orthanc.uclouvain.be/book/users/storage-commitment.html#removing-the-instances
