info:
  name: Retrieve all answers with C-MOVE SCU
  type: http
  seq: 40
  tags:
    - Networking

http:
  method: POST
  url: "{{baseUrl}}/queries/:id/retrieve"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the query of interest
  body:
    type: json
    data: |-
      {
        "Asynchronous": false,
        "Full": false,
        "Permissive": false,
        "Priority": 0,
        "RetrieveMethod": "",
        "Simplify": false,
        "Synchronous": false,
        "TargetAet": "",
        "Timeout": 0,
        "UserData": {}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Start a C-MOVE SCU command as a job, in order to retrieve all the answers associated with the query/retrieve operation whose identifier is provided in the URL: https://orthanc.uclouvain.be/book/users/rest.html#performing-retrieve-c-move"
