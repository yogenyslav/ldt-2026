info:
  name: Straight C-STORE SCU
  type: http
  seq: 18
  tags:
    - Networking

http:
  method: POST
  url: "{{baseUrl}}/modalities/:id/store-straight"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the modality of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Synchronously send the DICOM instance in the POST body to the remote DICOM modality whose identifier is provided in URL, without having to first store it locally within Orthanc. This is an alternative to command-line tools such as `storescu` from DCMTK or dcm4che.
