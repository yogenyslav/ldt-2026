info:
  name: Trigger C-ECHO SCU
  type: http
  seq: 6
  tags:
    - Networking

http:
  method: POST
  url: "{{baseUrl}}/modalities/:id/echo"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the modality of interest
  body:
    type: json
    data: |-
      {
        "CheckFind": false,
        "Timeout": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/modalities/:id/echo"
      method: POST
      params:
        - name: id
          value: ""
          type: path
          description: Identifier of the modality of interest
      body:
        type: json
        data: |-
          {
            "CheckFind": false,
            "Timeout": 0
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: "Trigger C-ECHO SCU command against the DICOM modality whose identifier is provided in URL: https://orthanc.uclouvain.be/book/users/rest.html#performing-c-echo"
