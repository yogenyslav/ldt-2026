info:
  name: Trigger C-GET SCU
  type: http
  seq: 13
  tags:
    - Networking

http:
  method: POST
  url: "{{baseUrl}}/modalities/:id/get"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the modality of interest
  body:
    type: json
    data: |-
      {
        "Asynchronous": false,
        "Level": "",
        "LocalAet": "",
        "Permissive": false,
        "Priority": 0,
        "Resources": [
          {}
        ],
        "Synchronous": false,
        "Timeout": 0,
        "UserData": {}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Start a C-GET SCU command as a job, in order to retrieve DICOM resources from a remote DICOM modality whose identifier is provided in the URL: "
