info:
  name: Trigger C-STORE SCU
  type: http
  seq: 17
  tags:
    - Networking

http:
  method: POST
  url: "{{baseUrl}}/modalities/:id/store"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the modality of interest
  body:
    type: json
    data: |-
      {
        "Asynchronous": false,
        "CalledAet": "",
        "Host": "",
        "LocalAet": "",
        "MoveOriginatorAet": "",
        "MoveOriginatorID": 0,
        "Permissive": false,
        "Port": 0,
        "Priority": 0,
        "Resources": [],
        "StorageCommitment": false,
        "Synchronous": false,
        "Timeout": 0,
        "UserData": {}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Start a C-STORE SCU command as a job, in order to send DICOM resources stored locally to some remote DICOM modality whose identifier is provided in the URL: https://orthanc.uclouvain.be/book/users/rest.html#rest-store-scu"
