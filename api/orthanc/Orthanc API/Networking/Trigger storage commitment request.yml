info:
  name: Trigger storage commitment request
  type: http
  seq: 16
  tags:
    - Networking

http:
  method: POST
  url: "{{baseUrl}}/modalities/:id/storage-commitment"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the modality of interest
  body:
    type: json
    data: |-
      {
        "DicomInstances": [
          {}
        ],
        "Resources": [],
        "Timeout": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Trigger a storage commitment request to some remote DICOM modality whose identifier is provided in the URL: https://orthanc.uclouvain.be/book/users/storage-commitment.html#storage-commitment-scu"
