info:
  name: Update Orthanc peer
  type: http
  seq: 22
  tags:
    - Networking

http:
  method: PUT
  url: "{{baseUrl}}/peers/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Identifier of the new/updated Orthanc peer
  body:
    type: json
    data: |-
      {
        "CertificateFile": "",
        "CertificateKeyFile": "",
        "CertificateKeyPassword": "",
        "HttpHeaders": {},
        "Password": "",
        "URL": "",
        "Username": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/peers/:id"
      method: PUT
      params:
        - name: id
          value: ""
          type: path
          description: Identifier of the new/updated Orthanc peer
      body:
        type: json
        data: |-
          {
            "CertificateFile": "",
            "CertificateKeyFile": "",
            "CertificateKeyPassword": "",
            "HttpHeaders": {},
            "Password": "",
            "URL": "",
            "Username": ""
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: Define a new Orthanc peer, or update an existing one. This change is permanent iff. `OrthancPeersInDatabase` is `true`, otherwise it is lost at the next restart of Orthanc.
