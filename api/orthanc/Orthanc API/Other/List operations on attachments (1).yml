info:
  name: List operations on attachments (1)
  type: http
  seq: 4
  tags:
    - Other

http:
  method: GET
  url: "{{baseUrl}}/series/:id/attachments/:name"
  headers:
    - name: If-None-Match
      value: ""
      description: Optional revision of the attachment, to check if its content has changed
      disabled: true
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the series of interest
    - name: name
      value: ""
      type: path
      description: The name of the attachment, or its index (cf. `UserContentType` configuration option)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/series/:id/attachments/:name"
      method: GET
      headers:
        - name: If-None-Match
          value: ""
          description: Optional revision of the attachment, to check if its content has changed
          disabled: true
      params:
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the series of interest
        - name: name
          value: ""
          type: path
          description: The name of the attachment, or its index (cf. `UserContentType` configuration option)
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            "compress",
            "compressed-data",
            "compressed-md5",
            "compressed-size",
            "data",
            "info",
            "is-compressed",
            "md5",
            "size",
            "uncompress",
            "verify-md5"
          ]

docs: Get the list of the operations that are available for attachments associated with the given series
