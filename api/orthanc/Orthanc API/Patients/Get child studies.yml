info:
  name: Get child studies
  type: http
  seq: 41
  tags:
    - Patients

http:
  method: GET
  url: "{{baseUrl}}/patients/:id/studies"
  params:
    - name: expand
      value: ""
      type: query
      description: If false or missing, only retrieve the list of child studies
      disabled: true
    - name: full
      value: ""
      type: query
      description: If present, report the DICOM tags in full format (tags indexed by their hexadecimal format, associated with their symbolic name and their value)
      disabled: true
    - name: requested-tags
      value: ""
      type: query
      description: "If present, list the DICOM Tags you want to list in the response.  This argument is a semi-column separated list of DICOM Tags identifiers; e.g: 'requested-tags=0010,0010;PatientBirthDate'.  The tags requested tags are returned in the 'RequestedTags' field in the response.  Note that, if you are requesting tags that are not listed in the Main Dicom Tags stored in DB, building the response might be slow since Orthanc will need to access the DICOM files.  If not specified, Orthanc will return all Main Dicom Tags to keep backward compatibility with Orthanc prior to 1.11.0."
      disabled: true
    - name: short
      value: ""
      type: query
      description: If present, report the DICOM tags in hexadecimal format
      disabled: true
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the patient of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/patients/:id/studies"
      method: GET
      params:
        - name: expand
          value: ""
          type: query
          description: If false or missing, only retrieve the list of child studies
          disabled: true
        - name: full
          value: ""
          type: query
          description: If present, report the DICOM tags in full format (tags indexed by their hexadecimal format, associated with their symbolic name and their value)
          disabled: true
        - name: requested-tags
          value: ""
          type: query
          description: "If present, list the DICOM Tags you want to list in the response.  This argument is a semi-column separated list of DICOM Tags identifiers; e.g: 'requested-tags=0010,0010;PatientBirthDate'.  The tags requested tags are returned in the 'RequestedTags' field in the response.  Note that, if you are requesting tags that are not listed in the Main Dicom Tags stored in DB, building the response might be slow since Orthanc will need to access the DICOM files.  If not specified, Orthanc will return all Main Dicom Tags to keep backward compatibility with Orthanc prior to 1.11.0."
          disabled: true
        - name: short
          value: ""
          type: query
          description: If present, report the DICOM tags in hexadecimal format
          disabled: true
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the patient of interest
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "ID": "e98b9ac7-dd31ac40-ff046cb2-f0400d30-12f81d85",
              "IsStable": true,
              "Labels": [],
              "LastUpdate": "20231109T160830",
              "MainDicomTags": {
                "AccessionNumber": "0",
                "InstitutionName": "dPJ",
                "ReferringPhysicianName": "YzTEkpkak0p0Tk5",
                "RequestedProcedureDescription": "CT2 tête, face, sinus",
                "StudyDate": "20060531",
                "{...}": "..."
              },
              "{...}": "..."
            }
          ]

docs: Get detailed information about the child studies of the DICOM patient whose Orthanc identifier is provided in the URL
