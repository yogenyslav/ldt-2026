info:
  name: Get patient module
  type: http
  seq: 34
  tags:
    - Patients

http:
  method: GET
  url: "{{baseUrl}}/patients/:id/module"
  params:
    - name: ignore-length
      value: "[]"
      type: query
      description: Also include the DICOM tags that are provided in this list, even if their associated value is long
      disabled: true
    - name: short
      value: ""
      type: query
      description: If present, report the DICOM tags in hexadecimal format
      disabled: true
    - name: simplify
      value: ""
      type: query
      description: If present, report the DICOM tags in human-readable format (using the symbolic name of the tags)
      disabled: true
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the patient of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/patients/:id/module"
      method: GET
      params:
        - name: ignore-length
          value: "[]"
          type: query
          description: Also include the DICOM tags that are provided in this list, even if their associated value is long
          disabled: true
        - name: short
          value: ""
          type: query
          description: If present, report the DICOM tags in hexadecimal format
          disabled: true
        - name: simplify
          value: ""
          type: query
          description: If present, report the DICOM tags in human-readable format (using the symbolic name of the tags)
          disabled: true
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the patient of interest
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "0010,0010": {
              "Name": "PatientName",
              "Type": "String",
              "Value": "INCISIX"
            },
            "0010,0020": {
              "Name": "PatientID",
              "Type": "String",
              "Value": "SOtNwu"
            }
          }

docs: Get the patient module of the DICOM patient whose Orthanc identifier is provided in the URL
