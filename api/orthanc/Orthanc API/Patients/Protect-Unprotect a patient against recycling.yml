info:
  name: Protect/Unprotect a patient against recycling
  type: http
  seq: 36
  tags:
    - Patients

http:
  method: PUT
  url: "{{baseUrl}}/patients/:id/protected"
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the patient of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/patients/:id/protected"
      method: PUT
      params:
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the patient of interest
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: "Protects a patient by sending `1` or `true` in the payload request. Unprotects a patient by sending `0` or `false` in the payload requests. More info: https://orthanc.uclouvain.be/book/faq/features.html#recycling-protection"
