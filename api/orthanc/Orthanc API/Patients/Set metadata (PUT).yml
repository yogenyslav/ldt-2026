info:
  name: Set metadata (PUT)
  type: http
  seq: 32
  tags:
    - Patients

http:
  method: PUT
  url: "{{baseUrl}}/patients/:id/metadata/:name"
  headers:
    - name: If-Match
      value: ""
      description: Revision of the metadata, if this is not the first time this metadata is set.
      disabled: true
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the patient of interest
    - name: name
      value: ""
      type: path
      description: The name of the metadata, or its index (cf. `UserMetadata` configuration option)
  body:
    type: text
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/patients/:id/metadata/:name"
      method: PUT
      headers:
        - name: If-Match
          value: ""
          description: Revision of the metadata, if this is not the first time this metadata is set.
          disabled: true
      params:
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the patient of interest
        - name: name
          value: ""
          type: path
          description: The name of the metadata, or its index (cf. `UserMetadata` configuration option)
      body:
        type: text
        data: ""
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: Set the value of some metadata in the given DICOM patient. This call will fail if trying to modify a system metadata (i.e. whose index is < 1024).
