info:
  name: Decode series for numpy
  type: http
  seq: 35
  tags:
    - Series

http:
  method: GET
  url: "{{baseUrl}}/series/:id/numpy"
  params:
    - name: compress
      value: ""
      type: query
      description: Compress the file as `.npz`
      disabled: true
    - name: rescale
      value: ""
      type: query
      description: On grayscale images, apply the rescaling and return floating-point values
      disabled: true
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the DICOM resource of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Decode the given DICOM series, for use with numpy in Python. The numpy array has 4 dimensions: (frame, height, width, color channel)."
