info:
  name: Get size of attachment (1)
  type: http
  seq: 18
  tags:
    - Series

http:
  method: GET
  url: "{{baseUrl}}/series/:id/attachments/:name/size"
  headers:
    - name: If-None-Match
      value: ""
      description: Optional revision of the attachment, to check if its content has changed
      disabled: true
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the series of interest
    - name: name
      value: ""
      type: path
      description: The name of the attachment, or its index (cf. `UserContentType` configuration option)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Get the size of one attachment associated with the given series
