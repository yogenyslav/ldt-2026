info:
  name: List labels (1)
  type: http
  seq: 23
  tags:
    - Series

http:
  method: GET
  url: "{{baseUrl}}/series/:id/labels"
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the series of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/series/:id/labels"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the series of interest
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "[]"

docs: Get the labels that are associated with the given series (new in Orthanc 1.12.0)
