info:
  name: Create ZIP archive (4)
  type: http
  seq: 5
  tags:
    - Studies

http:
  method: GET
  url: "{{baseUrl}}/studies/:id/archive"
  params:
    - name: filename
      value: ""
      type: query
      description: Filename to set in the "Content-Disposition" HTTP header (including file extension)
      disabled: true
    - name: lossy-quality
      value: ""
      type: query
      description: If transcoding to a lossy transfer syntax, this entry defines the quality as an integer between 1 and 100.  If not provided, the value is defined by the "DicomLossyTranscodingQuality" configuration. (new in v1.12.7)
      disabled: true
    - name: transcode
      value: ""
      type: query
      description: "If present, the DICOM files in the archive will be transcoded to the provided transfer syntax: https://orthanc.uclouvain.be/book/faq/transcoding.html"
      disabled: true
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the study of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Synchronously create a ZIP archive containing the DICOM study whose Orthanc identifier is provided in the URL. This flavor is synchronous, which might *not* be desirable to archive large amount of data, as it might lead to network timeouts. Prefer the asynchronous version using `POST` method.
