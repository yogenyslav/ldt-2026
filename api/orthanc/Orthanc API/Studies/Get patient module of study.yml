info:
  name: Get patient module of study
  type: http
  seq: 36
  tags:
    - Studies

http:
  method: GET
  url: "{{baseUrl}}/studies/:id/module-patient"
  params:
    - name: ignore-length
      value: "[]"
      type: query
      description: Also include the DICOM tags that are provided in this list, even if their associated value is long
      disabled: true
    - name: short
      value: ""
      type: query
      description: If present, report the DICOM tags in hexadecimal format
      disabled: true
    - name: simplify
      value: ""
      type: query
      description: If present, report the DICOM tags in human-readable format (using the symbolic name of the tags)
      disabled: true
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the study of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/studies/:id/module-patient"
      method: GET
      params:
        - name: ignore-length
          value: "[]"
          type: query
          description: Also include the DICOM tags that are provided in this list, even if their associated value is long
          disabled: true
        - name: short
          value: ""
          type: query
          description: If present, report the DICOM tags in hexadecimal format
          disabled: true
        - name: simplify
          value: ""
          type: query
          description: If present, report the DICOM tags in human-readable format (using the symbolic name of the tags)
          disabled: true
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the study of interest
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "0010,0010": {
              "Name": "PatientName",
              "Type": "String",
              "Value": "BRAINIX"
            },
            "0010,0020": {
              "Name": "PatientID",
              "Type": "String",
              "Value": "5Yp0E"
            },
            "0010,0030": {
              "Name": "PatientBirthDate",
              "Type": "String",
              "Value": "19490301"
            },
            "0010,0040": {
              "Name": "PatientSex",
              "Type": "String",
              "Value": "0000"
            }
          }

docs: Get the patient module of the DICOM study whose Orthanc identifier is provided in the URL
