info:
  name: Get shared tags (1)
  type: http
  seq: 40
  tags:
    - Studies

http:
  method: GET
  url: "{{baseUrl}}/studies/:id/shared-tags"
  params:
    - name: short
      value: ""
      type: query
      description: If present, report the DICOM tags in hexadecimal format
      disabled: true
    - name: simplify
      value: ""
      type: query
      description: If present, report the DICOM tags in human-readable format (using the symbolic name of the tags)
      disabled: true
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the study of interest
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/studies/:id/shared-tags"
      method: GET
      params:
        - name: short
          value: ""
          type: query
          description: If present, report the DICOM tags in hexadecimal format
          disabled: true
        - name: simplify
          value: ""
          type: query
          description: If present, report the DICOM tags in human-readable format (using the symbolic name of the tags)
          disabled: true
        - name: id
          value: ""
          type: path
          description: Orthanc identifier of the study of interest
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "0008,0005": {
              "Name": "SpecificCharacterSet",
              "Type": "String",
              "Value": "ISO_IR 100"
            },
            "0008,0012": {
              "Name": "InstanceCreationDate",
              "Type": "String",
              "Value": "20061201"
            },
            "0008,0014": {
              "Name": "InstanceCreatorUID",
              "Type": "String",
              "Value": "1.3.46.670589.11.8743.5"
            },
            "0008,0016": {
              "Name": "SOPClassUID",
              "Type": "String",
              "Value": "1.2.840.10008.5.1.4.1.1.4"
            },
            "0008,0020": {
              "Name": "StudyDate",
              "Type": "String",
              "Value": "20061201"
            },
            "{...}": "..."
          }

docs: Extract the DICOM tags whose value is constant across all the child instances of the DICOM study whose Orthanc identifier is provided in the URL
