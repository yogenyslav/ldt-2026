info:
  name: Is attachment compressed? (2)
  type: http
  seq: 16
  tags:
    - Studies

http:
  method: GET
  url: "{{baseUrl}}/studies/:id/attachments/:name/is-compressed"
  headers:
    - name: If-None-Match
      value: ""
      description: Optional revision of the attachment, to check if its content has changed
      disabled: true
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the study of interest
    - name: name
      value: ""
      type: path
      description: The name of the attachment, or its index (cf. `UserContentType` configuration option)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Test whether the attachment has been stored as a compressed file on the disk.
