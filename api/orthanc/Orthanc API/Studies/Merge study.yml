info:
  name: Merge study
  type: http
  seq: 29
  tags:
    - Studies

http:
  method: POST
  url: "{{baseUrl}}/studies/:id/merge"
  params:
    - name: id
      value: ""
      type: path
      description: Orthanc identifier of the study of interest
  body:
    type: json
    data: |-
      {
        "Asynchronous": false,
        "KeepSource": false,
        "Permissive": false,
        "Priority": 0,
        "Resources": [],
        "Synchronous": false,
        "UserData": {}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Start a new job so as to move some DICOM resources into the DICOM study whose Orthanc identifier is provided in the URL: https://orthanc.uclouvain.be/book/users/anonymization.html#merging"
