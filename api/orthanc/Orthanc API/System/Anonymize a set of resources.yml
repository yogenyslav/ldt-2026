info:
  name: Anonymize a set of resources
  type: http
  seq: 9
  tags:
    - System

http:
  method: POST
  url: "{{baseUrl}}/tools/bulk-anonymize"
  body:
    type: json
    data: |-
      {
        "Asynchronous": false,
        "DicomVersion": "",
        "Force": false,
        "Keep": [],
        "KeepLabels": false,
        "KeepPrivateTags": false,
        "KeepSource": false,
        "LossyQuality": 0,
        "Permissive": false,
        "Priority": 0,
        "PrivateCreator": "",
        "Remove": [],
        "Replace": {},
        "Resources": [],
        "Synchronous": false,
        "Transcode": "",
        "UserData": {}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Start a job that will anonymize all the DICOM patients, studies, series or instances whose identifiers are provided in the `Resources` field.
