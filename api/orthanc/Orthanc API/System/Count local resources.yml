info:
  name: Count local resources
  type: http
  seq: 13
  tags:
    - System

http:
  method: POST
  url: "{{baseUrl}}/tools/count-resources"
  body:
    type: json
    data: |-
      {
        "Full": false,
        "Labels": [],
        "LabelsConstraint": "",
        "Level": "",
        "MetadataQuery": {},
        "ParentPatient": "",
        "ParentSeries": "",
        "ParentStudy": "",
        "Query": {},
        "Short": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: This URI can be used to count the resources that are matching criteria on the content of the local Orthanc server, in a way that is similar to tools/find
