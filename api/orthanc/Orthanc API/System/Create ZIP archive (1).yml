info:
  name: Create ZIP archive (1)
  type: http
  seq: 15
  tags:
    - System

http:
  method: POST
  url: "{{baseUrl}}/tools/create-archive"
  body:
    type: json
    data: |-
      {
        "Asynchronous": false,
        "Filename": "",
        "LossyQuality": 0,
        "Priority": 0,
        "Resources": [],
        "Synchronous": false,
        "Transcode": "",
        "UserData": {},
        "Utf8": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Create a ZIP archive containing the DICOM resources (patients, studies, series, or instances) whose Orthanc identifiers are provided in the body
