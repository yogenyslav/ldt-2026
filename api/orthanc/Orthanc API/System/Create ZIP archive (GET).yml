info:
  name: Create ZIP archive (GET)
  type: http
  seq: 14
  tags:
    - System

http:
  method: GET
  url: "{{baseUrl}}/tools/create-archive"
  params:
    - name: filename
      value: ""
      type: query
      description: Filename to set in the "Content-Disposition" HTTP header (including file extension)
      disabled: true
    - name: lossy-quality
      value: ""
      type: query
      description: If transcoding to a lossy transfer syntax, this entry defines the quality as an integer between 1 and 100.  If not provided, the value is defined by the "DicomLossyTranscodingQuality" configuration. (new in v1.12.7)
      disabled: true
    - name: resources
      value: ""
      type: query
      description: A comma separated list of Orthanc resource identifiers to include in the ZIP archive.
    - name: transcode
      value: ""
      type: query
      description: "If present, the DICOM files will be transcoded to the provided transfer syntax: https://orthanc.uclouvain.be/book/faq/transcoding.html"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/tools/create-archive"
      method: GET
      params:
        - name: filename
          value: ""
          type: query
          description: Filename to set in the "Content-Disposition" HTTP header (including file extension)
          disabled: true
        - name: lossy-quality
          value: ""
          type: query
          description: If transcoding to a lossy transfer syntax, this entry defines the quality as an integer between 1 and 100.  If not provided, the value is defined by the "DicomLossyTranscodingQuality" configuration. (new in v1.12.7)
          disabled: true
        - name: resources
          value: ""
          type: query
          description: A comma separated list of Orthanc resource identifiers to include in the ZIP archive.
        - name: transcode
          value: ""
          type: query
          description: "If present, the DICOM files will be transcoded to the provided transfer syntax: https://orthanc.uclouvain.be/book/faq/transcoding.html"
          disabled: true
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: Create a ZIP archive containing the DICOM resources (patients, studies, series, or instances) whose Orthanc identifiers are provided in the 'resources' argument
