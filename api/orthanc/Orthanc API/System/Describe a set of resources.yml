info:
  name: Describe a set of resources
  type: http
  seq: 10
  tags:
    - System

http:
  method: POST
  url: "{{baseUrl}}/tools/bulk-content"
  body:
    type: json
    data: |-
      {
        "Full": false,
        "Level": "",
        "Metadata": false,
        "Resources": [],
        "Short": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/tools/bulk-content"
      method: POST
      body:
        type: json
        data: |-
          {
            "Full": false,
            "Level": "",
            "Metadata": false,
            "Resources": [],
            "Short": false
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: Get the content all the DICOM patients, studies, series or instances whose identifiers are provided in the `Resources` field, in one single call.
