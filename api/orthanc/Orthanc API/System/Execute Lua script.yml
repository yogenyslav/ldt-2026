  type: http
  seq: 25
  tags:
    - System

http:
  method: POST
  url: "{{baseUrl}}/tools/execute-script"
  body:
    type: text
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
