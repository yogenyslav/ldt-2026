info:
  name: Get database statistics
  type: http
  seq: 4
  tags:
    - System

http:
  method: GET
  url: "{{baseUrl}}/statistics"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/statistics"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "CountInstances": 2552,
            "CountPatients": 8,
            "CountSeries": 26,
            "CountStudies": 8,
            "TotalDiskSize": "1030997023",
            "TotalDiskSizeMB": 983,
            "TotalUncompressedSize": "1030997023",
            "TotalUncompressedSizeMB": 983
          }

docs: Get statistics related to the database of Orthanc
