info:
  name: Get default encoding
  type: http
  seq: 21
  tags:
    - System

http:
  method: GET
  url: "{{baseUrl}}/tools/default-encoding"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Get the default encoding that is used by Orthanc if parsing a DICOM instance without the `SpecificCharacterEncoding` tag, or during C-FIND. This corresponds to the configuration option `DefaultEncoding`.
