info:
  name: Invalidate DICOM-as-JSON summaries
  type: http
  seq: 28
  tags:
    - System

http:
  method: POST
  url: "{{baseUrl}}/tools/invalidate-tags"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/tools/invalidate-tags"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: Remove all the attachments of the type "DICOM-as-JSON" that are associated will all the DICOM instances stored in Orthanc. These summaries will be automatically re-created on the next access. This is notably useful after changes to the `Dictionary` configuration option. https://orthanc.uclouvain.be/book/faq/orthanc-storage.html#storage-area
