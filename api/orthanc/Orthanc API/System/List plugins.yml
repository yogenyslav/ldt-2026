info:
  name: List plugins
  type: http
  seq: 1
  tags:
    - System

http:
  method: GET
  url: "{{baseUrl}}/plugins"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/plugins"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            "explorer.js",
            "AWS S3 Storage",
            "authorization",
            "connectivity-checks",
            "delayed-deletion",
            "dicom-web",
            "education",
            "gdcm",
            "housekeeper",
            "indexer",
            "multitenant-dicom",
            "mysql-index",
            "mysql-storage",
            "neuro",
            "odbc-index",
            "odbc-storage",
            "ohif",
            "orthanc-explorer-2",
            "postgresql-index",
            "postgresql-storage",
            "serve-folders",
            "stl",
            "stone-rtviewer",
            "stone-webviewer",
            "tcia",
            "transfers",
            "volview",
            "web-viewer",
            "worklists",
            "wsi"
          ]

