info:
  name: Modify a set of resources
  type: http
  seq: 12
  tags:
    - System

http:
  method: POST
  url: "{{baseUrl}}/tools/bulk-modify"
  body:
    type: json
    data: |-
      {
        "Asynchronous": false,
        "Force": false,
        "Keep": [],
        "KeepSource": false,
        "Level": "",
        "LossyQuality": 0,
        "Permissive": false,
        "Priority": 0,
        "PrivateCreator": "",
        "Remove": [],
        "RemovePrivateTags": false,
        "Replace": {},
        "Resources": [],
        "Synchronous": false,
        "Transcode": "",
        "UserData": {}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Start a job that will modify all the DICOM patients, studies, series or instances whose identifiers are provided in the `Resources` field.
