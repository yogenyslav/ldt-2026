info:
  name: Reconstruct all the index
  type: http
  seq: 36
  tags:
    - System

http:
  method: POST
  url: "{{baseUrl}}/tools/reconstruct"
  body:
    type: json
    data: |-
      {
        "ReconstructFiles": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/tools/reconstruct"
      method: POST
      body:
        type: json
        data: |-
          {
            "ReconstructFiles": false
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: Reconstruct the index of all the tags of all the DICOM instances that are stored in Orthanc. This is notably useful after the deletion of resources whose children resources have inconsistent values with their sibling resources. Beware that this is a highly time-consuming operation, as all the DICOM instances will be parsed again, and as all the Orthanc index will be regenerated. If you have a large database to process, it is advised to use the Housekeeper plugin to perform this action resource by resource
