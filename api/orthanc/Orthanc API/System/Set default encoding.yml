info:
  name: Set default encoding
  type: http
  seq: 22
  tags:
    - System

http:
  method: PUT
  url: "{{baseUrl}}/tools/default-encoding"
  body:
    type: text
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/tools/default-encoding"
      method: PUT
      body:
        type: text
        data: ""
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: Change the default encoding that is used by Orthanc if parsing a DICOM instance without the `SpecificCharacterEncoding` tag, or during C-FIND. This corresponds to the configuration option `DefaultEncoding`.
