info:
  name: List changes
  type: http
  seq: 2
  tags:
    - Tracking changes

http:
  method: GET
  url: "{{baseUrl}}/changes"
  params:
    - name: last
      value: ""
      type: query
      description: Request only the last change id (this argument must be used alone)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Limit the number of results
      disabled: true
    - name: since
      value: ""
      type: query
      description: Show only the resources since the provided index excluded
      disabled: true
    - name: to
      value: ""
      type: query
      description: Show only the resources till the provided index included (only available if your DB backend supports ExtendedChanges)
      disabled: true
    - name: type
      value: ""
      type: query
      description: Show only the changes of the provided type (only available if your DB backend supports ExtendedChanges).  Multiple values can be provided and must be separated by a ';'.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/changes"
      method: GET
      params:
        - name: last
          value: ""
          type: query
          description: Request only the last change id (this argument must be used alone)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: Limit the number of results
          disabled: true
        - name: since
          value: ""
          type: query
          description: Show only the resources since the provided index excluded
          disabled: true
        - name: to
          value: ""
          type: query
          description: Show only the resources till the provided index included (only available if your DB backend supports ExtendedChanges)
          disabled: true
        - name: type
          value: ""
          type: query
          description: Show only the changes of the provided type (only available if your DB backend supports ExtendedChanges).  Multiple values can be provided and must be separated by a ';'.
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "Changes": [
              {
                "ChangeType": "NewInstance",
                "Date": "20231109T160739",
                "ID": "26d2e33b-3239a2d5-64f57e0b-d8da59a7-2ef362e7",
                "Path": "/instances/26d2e33b-3239a2d5-64f57e0b-d8da59a7-2ef362e7",
                "ResourceType": "Instance",
                "Seq": 1
              },
              {
                "ChangeType": "NewSeries",
                "Date": "20231109T160739",
                "ID": "1de00990-03680ef4-0be6bd5b-73a7d350-fb46abfa",
                "Path": "/series/1de00990-03680ef4-0be6bd5b-73a7d350-fb46abfa",
                "ResourceType": "Series",
                "Seq": 2
              }
            ],
            "Done": false,
            "First": 1,
            "Last": 2
          }

docs: Whenever Orthanc receives a new DICOM instance, this event is recorded in the so-called _Changes Log_. This enables remote scripts to react to the arrival of new DICOM resources. A typical application is auto-routing, where an external script waits for a new DICOM instance to arrive into Orthanc, then forward this instance to another modality. Please note that, when resources are deleted, their corresponding change entries are also removed from the Changes Log, which helps ensuring that this log does not grow indefinitely.
