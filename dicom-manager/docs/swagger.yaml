  get_image.GetImageOut:
    properties:
      image_data:
        description: Если Raw=false, то возвращается base64 изображения.
        type: string
      image_data_raw:
        description: Если Raw=true, байты изображения сериализуются в JSON как base64.
        format: byte
        type: string
    type: object
  get_paginated.GetInfoPaginatedOut:
    properties:
      jobs:
        description: Список информации о задачах на обработку DICOM-файлов.
        items:
          $ref: '#/definitions/model.JobInfo'
        type: array
    type: object
  get_paginated.GetPaginatedOut:
    properties:
      reports:
