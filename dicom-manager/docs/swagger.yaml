  internal_api_user_get_by_id.GetByIDOut:
    properties:
      full_name:
        description: Имя пользователя.
        type: string
      id:
        description: ID пользователя.
        type: integer
      organization_id:
        description: ID организации, к которой принадлежит пользователь.
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/model.UserRole'
        description: Роль пользователя (specialist, admin).
    type: object
  login.LoginIn:
    properties:
      email:
        description: Email пользователя для входа в систему.
        type: string
      password:
        description: Пароль пользователя для входа в систему.
        type: string
    type: object
  login.LoginOut:
    properties:
      organization_id:
        description: ID организации, к которой принадлежит пользователь.
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/model.UserRole'
        description: Роль пользователя (specialist, admin).
      token:
        description: JWT-токен, который будет использоваться для аутентификации последующих
