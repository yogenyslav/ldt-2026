  internal_api_organization_get_all.Organization:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  internal_api_organization_get_by_id.GetByIDOut:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  internal_api_report_get_by_id.GetByIDOut:
    properties:
      report:
        allOf:
        - $ref: '#/definitions/model.Report'
        description: Содержит отчет по результатам обработки DICOM-файлов.
