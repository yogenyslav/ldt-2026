        type: string
      dicom_series_uid:
        description: Внутреннее поле из DICOM файла.
        type: string
      dicom_study_uid:
        description: Внутреннее поле из DICOM файла.
        type: string
      file_name:
        type: string
      id:
        type: string
      organization_id:
        type: integer
      patient_id:
        type: string
      series_id:
        description: Поле из Orthanc.
        type: string
      study_id:
        description: Поле из Orthanc.
        type: string
      upload_source:
        enum:
        - unknown
        - manual
        - clinic
        type: string
    type: object
  internal_api_job_get_by_id.GetByIDOut:
    properties:
      job:
        allOf:
        - $ref: '#/definitions/model.JobInfo'
        description: Содержит информацию о задаче на обработку DICOM-файлоа.
