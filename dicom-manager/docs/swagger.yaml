        type: string
      user_id:
        description: ID пользователя.
        type: integer
    type: object
  model.Annotator:
    properties:
      id:
        type: string
      role:
        type: string
    type: object
  model.Decision:
    enum:
    - approved
    - rejected
    - force_approved
    type: string
    x-enum-comments:
      DecisionApprove: Результат задачи принят специалистом.
      DecisionForceApproved: Результат задачи принят специалистом, несмотря на рекомендацию
        системы.
      DecisionReject: Результат задачи отклонен специалистом.
    x-enum-descriptions:
    - Результат задачи принят специалистом.
    - Результат задачи отклонен специалистом.
    - Результат задачи принят специалистом, несмотря на рекомендацию системы.
    x-enum-varnames:
    - DecisionApprove
    - DecisionReject
    - DecisionForceApproved
  model.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  model.Image:
    properties:
      cols:
        type: integer
      region:
        type: string
      rows:
        type: integer
    type: object
  model.JobInfo:
    properties:
      anatomical_region:
        description: Анатомическая область, к которой относится DICOM-файл.
        type: string
      comment:
        description: Комментарий специалиста.
        type: string
      confidence:
        description: Уровень уверенности в результатах обработки от 0 до 1.
        type: number
      created_at:
        type: string
      dicom_id:
        description: ID DICOM-файла.
        type: string
      duration_ms:
        description: Время обработки задачи в миллисекундах.
        type: integer
      error:
        description: Описание ошибки обработки.
        type: string
      id:
        description: ID задачи на обработку.
        type: string
      metadata:
        additionalProperties: {}
        description: Дополнительные метаданные, связанные с задачей.
        type: object
      specialist_decision:
        allOf:
        - $ref: '#/definitions/model.Decision'
        description: Решение специалиста по результату задачи.
      specialist_id:
        description: ID специалиста, который принял решение.
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/model.JobStatus'
        description: Статус задачи на обработку.
      updated_at:
        type: string
      upload_source:
        enum:
        - unknown
        - manual
        - clinic
        type: string
      violations:
        description: Список нарушений, обнаруженных в DICOM-файле.
        items:
          type: string
        type: array
    type: object
  model.JobStatus:
    enum:
    - pending
    - processing
    - completed
    - failed
    type: string
    x-enum-comments:
      JobStatusCompleted: Задача успешно завершена.
      JobStatusFailed: Задача завершилась с ошибкой.
      JobStatusPending: Задача ожидает обработки.
      JobStatusProcessing: Задача в процессе обработки.
    x-enum-descriptions:
    - Задача ожидает обработки.
    - Задача в процессе обработки.
    - Задача успешно завершена.
    - Задача завершилась с ошибкой.
    x-enum-varnames:
    - JobStatusPending
    - JobStatusProcessing
    - JobStatusCompleted
    - JobStatusFailed
  model.ListResponse:
    properties:
      submissions:
        items:
          $ref: '#/definitions/model.Record'
        type: array
      total:
        type: integer
    type: object
  model.ModelsRequest:
    properties:
      models:
        items:
          type: string
        type: array
    type: object
  model.Record:
    properties:
      annotations:
        type: object
      annotator:
        $ref: '#/definitions/model.Annotator'
      comment:
        type: string
      created_at:
        type: string
      duration_ms:
        type: integer
      image:
        $ref: '#/definitions/model.Image'
      image_flags:
        items:
          type: string
        type: array
      job_id:
        type: string
      schema_version:
        type: string
      status:
        type: string
      submission_id:
        type: string
      superseded_by:
        type: string
      supersedes:
        type: string
      task_id:
        type: string
    type: object
  model.Report:
    properties:
      created_at:
        description: Дата и время создания отчета по результатам обработки DICOM-файлов.
        type: string
      download_url:
        description: URL для скачивания отчета по результатам обработки DICOM-файлов.
        type: string
      id:
        description: ID отчета по результатам обработки DICOM-файлов.
        type: integer
    type: object
  model.RotationSettings:
    properties:
      trochanter_center_mm:
        example: 2.7
        maximum: 8
        minimum: 0.1
        type: number
      trochanter_tol_percent:
        example: 63
        maximum: 100
        minimum: 0
        type: number
      trochanter_yellow_percent:
        example: 30
        maximum: 100
        minimum: 0
        type: number
    type: object
  model.Submission:
    properties:
      annotations:
        type: object
      comment:
        type: string
      created_at:
        type: string
      duration_ms:
        type: integer
      image:
        $ref: '#/definitions/model.Image'
      image_flags:
        items:
          type: string
        type: array
      job_id:
        type: string
      schema_version:
        type: string
      status:
        type: string
      submission_id:
        type: string
      supersedes:
        type: string
      task_id:
        type: string
    type: object
  model.SubmitResponse:
    properties:
      submission_id:
        type: string
      warnings:
        items:
          $ref: '#/definitions/model.Warning'
        type: array
    type: object
  model.UserRole:
    enum:
    - specialist
    - admin
    type: string
    x-enum-comments:
      UserRoleAdmin: Администратор системы.
      UserRoleSpecialist: Специалист, который может принимать решения по обработке
        DICOM-файлов.
    x-enum-descriptions:
    - Специалист, который может принимать решения по обработке DICOM-файлов.
    - Администратор системы.
    x-enum-varnames:
    - UserRoleSpecialist
    - UserRoleAdmin
  model.Warning:
    properties:
      code:
        type: string
      item:
        type: string
    type: object
  result_decision.ResultDecisionIn:
    properties:
      comment:
        description: Комментарий к решению по результатам обработки DICOM-файлов (необязательный).
        type: string
      decision:
        allOf:
        - $ref: '#/definitions/model.Decision'
        description: Решение по результатам обработки DICOM-файлов ("approved", "rejected",
          "force_approved").
      job_ids:
        description: Список ID задач на обработку DICOM-файлов, для которых необходимо
          принять решение по результатам.
        items:
          type: string
        type: array
    type: object
  upload.UploadOut:
    properties:
      dicom_id:
        type: string
      job_id:
        description: ID задачи на сервере для обработки DICOM файла.
        type: string
    type: object
  upload_batch.DicomData:
    properties:
      dicom_id:
        type: string
      job_id:
        description: ID задачи на сервере для обработки DICOM файла.
        type: string
    type: object
  upload_batch.UploadBatchOut:
    properties:
      data:
        description: Список данных о DICOM файлах и задачах на сервере.
        items:
          $ref: '#/definitions/upload_batch.DicomData'
        type: array
    type: object
  upload_orthanc.UploadIn:
    properties:
      device_model:
        type: string
      dicom_id:
        type: string
      dicom_image_uid:
        type: string
      dicom_series_uid:
        type: string
      dicom_study_uid:
        type: string
      file_name:
        type: string
      patient_id:
        type: string
      series_id:
        type: string
      study_id:
        type: string
    type: object
  upload_orthanc.UploadOut:
    properties:
      dicom_id:
        type: string
    type: object
info:
  contact: {}
paths:
  /annotation/submission:
    post:
      consumes:
      - application/json
      parameters:
      - description: Разметка снимка
        in: body
        name: submission
        required: true
        schema:
          $ref: '#/definitions/model.Submission'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.SubmitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Сохранить разметку снимка
      tags:
      - annotation
  /annotation/submissions:
    get:
      parameters:
      - default: 50
        description: Размер страницы
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: Идентификатор задачи анализа
        in: query
        name: job_id
        type: string
      - description: Статус разметки
        enum:
        - done
        - uncertain
        - skipped
        in: query
        name: status
        type: string
      - default: true
        description: Только актуальные отправки
        in: query
        name: only_latest
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Получить сохранённую разметку
      tags:
      - annotation
  /annotation/training:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/annotation.TrainingResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Получить состояние дообучения
      tags:
      - annotation
  /annotation/training/start:
    post:
      consumes:
      - application/json
      description: Пока исполнитель не подключён, возвращает 409 без постановки в
        очередь.
      parameters:
      - description: Выбранные модели
        in: body
        name: models
        required: true
        schema:
          $ref: '#/definitions/model.ModelsRequest'
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Запросить дообучение моделей
      tags:
      - annotation
  /annotation/training/switch:
    post:
      consumes:
      - application/json
      description: До появления новых обученных версий возвращает 404.
      parameters:
      - description: Выбранные модели
        in: body
        name: models
        required: true
        schema:
          $ref: '#/definitions/model.ModelsRequest'
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Запросить переключение версии модели
      tags:
      - annotation
  /dicom/{dicom_id}:
    get:
      consumes:
      - application/json
      description: Получить DICOM-файл по его идентификатору, включая метаданные пациента
        и аппарата, без updated_at.
      parameters:
      - description: DICOM ID
        in: path
        name: dicom_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: DICOM-файл успешно получен.
          schema:
            $ref: '#/definitions/internal_api_dicom_get_by_id.GetByIDOut'
        "400":
          description: Некорректный запрос.
          schema:
            type: string
        "403":
          description: Доступ запрещен.
          schema:
            type: string
        "404":
          description: DICOM-файл не найден.
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера.
          schema:
            type: string
      summary: Получить DICOM-файл
      tags:
      - dicom
  /dicom/{dicom_id}/image:
    get:
      consumes:
      - application/json
      description: Получить изображение DICOM по его идентификатору. Можно указать
        флаг raw, чтобы получить байты изображения вместо base64.
      parameters:
      - description: DICOM ID
        in: path
        name: dicom_id
        required: true
        type: string
      - description: Флаг, указывающий, что нужно вернуть байты изображения вместо
          base64.
        in: query
        name: raw
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: DICOM изображение успешно получено.
          schema:
            $ref: '#/definitions/get_image.GetImageOut'
        "400":
          description: Некорректный запрос.
          schema:
            type: string
        "403":
          description: Доступ запрещен.
          schema:
            type: string
        "404":
          description: DICOM изображение не найдено.
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера.
          schema:
            type: string
      summary: Получить изображение DICOM
      tags:
      - dicom
  /dicom/{dicom_id}/jobs:
    get:
      description: Возвращает все попытки обработки от новых к старым. Доступ разрешён
        владельцу файла и администратору. Каждая задача содержит upload_source; при
        несовпадении фильтров возвращается пустой список.
      parameters:
      - description: ID DICOM-файла
        in: path
        name: dicom_id
        required: true
        type: string
      - collectionFormat: csv
        description: ID организаций через запятую
        in: query
        items:
          format: int64
          type: integer
        name: organization_ids
        type: array
      - collectionFormat: csv
        description: Источники загрузки DICOM через запятую
        in: query
        items:
          enum:
          - manual
          - clinic
          type: string
        name: upload_source
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Список задач
          schema:
            $ref: '#/definitions/get_by_dicom_id.GetByDicomIDOut'
        "400":
          description: Некорректные фильтры.
          schema:
            type: string
