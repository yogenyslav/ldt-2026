name: dicom-worker

services:
  dicom-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: dicom-worker
    restart: unless-stopped
    command: ["./service"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_REPLICAS=3
      - METRICS_ADDR=:9100
      - APP_NAME=dicom-worker
      - DB_USER=${DICOM_WORKER_DB_USER}
      - DB_PASSWORD=${DICOM_WORKER_DB_PASSWORD}
      - DB_NAME=${DICOM_WORKER_DB_NAME}
      - DB_HOST=dicom-worker-postgres
      - DB_PORT=5432
    ports:
      - "127.0.0.1:11000:${DICOM_WORKER_PORT:-11000}"
    networks:
      - dicom-network

  dicom-worker-outbox:
    build:
        context: .
        dockerfile: Dockerfile
        target: prod
    container_name: dicom-worker-outbox
    restart: unless-stopped
    command: ["./outbox"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_REPLICAS=3
      - METRICS_ADDR=:9100
      - APP_NAME=dicom-worker-outbox
      - DB_USER=${DICOM_WORKER_DB_USER}
      - DB_PASSWORD=${DICOM_WORKER_DB_PASSWORD}
      - DB_NAME=${DICOM_WORKER_DB_NAME}
      - DB_HOST=dicom-worker-postgres
      - DB_PORT=5432
    networks:
      - dicom-network

  dicom-worker-result-listener:
    build:
        context: .
        dockerfile: Dockerfile
        target: prod
    container_name: dicom-worker-result-listener
    restart: unless-stopped
    command: ["./result_listener"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - NATS_URL=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      - NATS_REPLICAS=3
      - METRICS_ADDR=:9100
      - APP_NAME=dicom-worker-result-listener
      - DB_USER=${DICOM_WORKER_DB_USER}
      - DB_PASSWORD=${DICOM_WORKER_DB_PASSWORD}
      - DB_NAME=${DICOM_WORKER_DB_NAME}
      - DB_HOST=dicom-worker-postgres
      - DB_PORT=5432
    networks:
      - dicom-network

  postgres:
    image: postgres:17-alpine
    container_name: dicom-worker-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DICOM_WORKER_DB_USER} -d ${DICOM_WORKER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ../.env
    environment:
      - POSTGRES_USER=${DICOM_WORKER_DB_USER}
      - POSTGRES_PASSWORD=${DICOM_WORKER_DB_PASSWORD}
      - POSTGRES_DB=${DICOM_WORKER_DB_NAME}
    ports:
      - "127.0.0.1:${DICOM_WORKER_DB_PORT:-5433}:5432"
    networks:
      - dicom-network

networks:
  dicom-network:
    external: true
