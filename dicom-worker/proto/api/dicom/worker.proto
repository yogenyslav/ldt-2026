syntax = "proto3";

package api.dicom.worker;
option go_package = "internal/generated/dicom-worker;dicom_worker";

service DicomWorkerService {
  rpc ProcessDicom (ProcessDicomIn) returns (ProcessDicomOut) {}
  rpc BatchProcessDicom (stream ProcessDicomIn) returns (stream ProcessDicomOut) {}
  rpc GetJobStatus (GetJobStatusIn) returns (GetJobStatusOut) {}
  rpc GetJobInfo (GetJobInfoIn) returns (GetJobInfoOut) {}
  rpc GetJobInfoByIDs (GetJobInfoByIDsIn) returns (GetJobInfoByIDsOut) {}
  rpc GetJobsByCreator (GetJobsByCreatorIn) returns (GetJobsByCreatorOut) {}
  rpc GetJobsByOrganisation (GetJobsByOrganisationIn) returns (GetJobsByOrganisationOut) {}
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING     = 1;
  JOB_STATUS_RUNNING     = 2;
  JOB_STATUS_COMPLETED   = 3;
  JOB_STATUS_FAILED      = 4;
}

message ProcessDicomIn {
  string dicom_uid      = 1;
  string dicom_study_id = 2;
  int64 creator_id = 3;
  int64 organisation_id = 4;
}

message ProcessDicomOut {
  int64 job_id = 1;
}

message GetJobStatusIn {
  int64 job_id = 1;
}

message GetJobStatusOut {
  JobStatus status = 1;
}

message JobInfo {
  int64     job_id         = 1;
  int64     creator_id     = 2;
  string    dicom_uid      = 3;
  string    dicom_study_id = 4;
  JobStatus status         = 5;
}

message GetJobInfoIn {
  int64 job_id = 1;
}

message GetJobInfoOut {
  JobInfo job = 1;
}

message GetJobInfoByIDsIn {
  repeated int64 job_ids = 1;
}

message GetJobInfoByIDsOut {
  repeated JobInfo job = 1;
}

message GetJobsByCreatorIn {
  string creator_id = 1;
  int64  offset     = 2;
  int64  limit      = 3;
}

message GetJobsByCreatorOut {
  repeated JobInfo jobs = 1;
}
