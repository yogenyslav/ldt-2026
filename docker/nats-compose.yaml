name: nats_cluster
services:
  nats-1:
    image: docker.io/nats:2.12
    container_name: nats-1
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_1_data:/data
    command:
      - "--name=nats-1"
      - "--cluster_name=c1"
      - "--cluster=nats://nats-1:6222"
      - "--routes=nats-route://nats-1:6222,nats-route://nats-2:6222,nats-route://nats-3:6222"
      - "--http_port=8222"
      - "--js"
      - "--sd=/data"

  nats-2:
    image: docker.io/nats:2.12
    container_name: nats-2
    restart: unless-stopped
    ports:
      - "4223:4222"
      - "8223:8222"
    volumes:
      - nats_2_data:/data
    command:
      - "--name=nats-2"
      - "--cluster_name=c1"
      - "--cluster=nats://nats-2:6222"
      - "--routes=nats-route://nats-1:6222,nats-route://nats-2:6222,nats-route://nats-3:6222"
      - "--http_port=8222"
      - "--js"
      - "--sd=/data"

  nats-3:
    image: docker.io/nats:2.12
    container_name: nats-3
    restart: unless-stopped
    ports:
      - "4224:4222"
      - "8224:8222"
    volumes:
      - nats_3_data:/data
    command:
      - "--name=nats-3"
      - "--cluster_name=c1"
      - "--cluster=nats://nats-3:6222"
      - "--routes=nats-route://nats-1:6222,nats-route://nats-2:6222,nats-route://nats-3:6222"
      - "--http_port=8222"
      - "--js"
      - "--sd=/data"

volumes:
  nats_1_data:
  nats_2_data:
  nats_3_data: