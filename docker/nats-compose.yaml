name: dicom-nats-cluster

services:
  nats-1:
    image: docker.io/nats:2.12
    container_name: nats-1
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NATS_ROUTE_1: nats://nats-route:${NATS_ROUTE_PASSWORD}@nats-1:6222
      NATS_ROUTE_2: nats://nats-route:${NATS_ROUTE_PASSWORD}@nats-2:6222
      NATS_ROUTE_3: nats://nats-route:${NATS_ROUTE_PASSWORD}@nats-3:6222

    ports:
      - "4222:4222"
      - "8222:8222"

    volumes:
      - ./nats.conf:/etc/nats/nats-server.conf:ro
      - nats_1_data:/data

    command:
      - "--config"
      - "/etc/nats/nats-server.conf"
      - "--name"
      - "nats-1"

    networks:
      - dicom-network

  nats-2:
    image: docker.io/nats:2.12
    container_name: nats-2
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NATS_ROUTE_1: nats://nats-route:${NATS_ROUTE_PASSWORD}@nats-1:6222
      NATS_ROUTE_2: nats://nats-route:${NATS_ROUTE_PASSWORD}@nats-2:6222
      NATS_ROUTE_3: nats://nats-route:${NATS_ROUTE_PASSWORD}@nats-3:6222

    ports:
      - "4223:4222"
      - "8223:8222"

    volumes:
      - ./nats.conf:/etc/nats/nats-server.conf:ro
      - nats_2_data:/data

    command:
      - "--config"
      - "/etc/nats/nats-server.conf"
      - "--name"
      - "nats-2"

    networks:
      - dicom-network

  nats-3:
    image: docker.io/nats:2.12
    container_name: nats-3
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NATS_ROUTE_1: nats://nats-route:${NATS_ROUTE_PASSWORD}@nats-1:6222
      NATS_ROUTE_2: nats://nats-route:${NATS_ROUTE_PASSWORD}@nats-2:6222
      NATS_ROUTE_3: nats://nats-route:${NATS_ROUTE_PASSWORD}@nats-3:6222

    ports:
      - "4224:4222"
      - "8224:8222"

    volumes:
      - ./nats.conf:/etc/nats/nats-server.conf:ro
      - nats_3_data:/data

    command:
      - "--config"
      - "/etc/nats/nats-server.conf"
      - "--name"
      - "nats-3"

    networks:
      - dicom-network

volumes:
  nats_1_data:
  nats_2_data:
  nats_3_data:

networks:
  dicom-network:
    external: true
