# ============================================================
# General
# ============================================================

port: 4222
http: 0.0.0.0:8222


# ============================================================
# Cluster
# ============================================================

cluster {
  name: c1
  listen: 0.0.0.0:6222

  authorization {
    user: nats-route
    password: $NATS_ROUTE_PASSWORD
  }

  routes: [
    $NATS_ROUTE_1
    $NATS_ROUTE_2
    $NATS_ROUTE_3
  ]
}


# ============================================================
# Accounts
# ============================================================

accounts {
  $SYS {
    users: [
      {
        user: sys
        password: $NATS_SYS_PASSWORD
      }
    ]
  }

  DICOM {
    jetstream: enabled
    users: [
      {
        user: dicom-worker
        password: $DICOM_WORKER_PASSWORD
        permissions {
          publish {
            allow: [
              "$JS.API.STREAM.CREATE.DICOM_EVENTS"
              "$JS.API.STREAM.INFO.DICOM_EVENTS"
              "$JS.API.CONSUMER.CREATE.DICOM_EVENTS.worker-completed"
              "$JS.API.CONSUMER.CREATE.DICOM_EVENTS.worker-completed.>"
              "$JS.API.CONSUMER.DURABLE.CREATE.DICOM_EVENTS.worker-completed"
              "$JS.API.CONSUMER.INFO.DICOM_EVENTS.worker-completed"
              "$JS.API.CONSUMER.MSG.NEXT.DICOM_EVENTS.worker-completed"
              "$JS.ACK.DICOM_EVENTS.worker-completed.>"
              "$JS.API.CONSUMER.CREATE.DICOM_EVENTS.worker-failed"
              "$JS.API.CONSUMER.CREATE.DICOM_EVENTS.worker-failed.>"
              "$JS.API.CONSUMER.DURABLE.CREATE.DICOM_EVENTS.worker-failed"
              "$JS.API.CONSUMER.INFO.DICOM_EVENTS.worker-failed"
              "$JS.API.CONSUMER.MSG.NEXT.DICOM_EVENTS.worker-failed"
              "$JS.ACK.DICOM_EVENTS.worker-failed.>"
              "dicom.analysis.requested"
              "dicom.document.updated"
              "dicom.document.failed"
            ]
          }
          subscribe {
            allow: [
              "dicom.analysis.completed"
              "dicom.analysis.failed"
              "_INBOX.>"
            ]
          }
        }
      }

      {
        user: dicom-manager
        password: $DICOM_MANAGER_PASSWORD
        permissions {
          publish {
            allow: [
              "$JS.API.STREAM.CREATE.DICOM_EVENTS"
              "$JS.API.STREAM.INFO.DICOM_EVENTS"
              "$JS.API.CONSUMER.CREATE.DICOM_EVENTS.manager-updated"
              "$JS.API.CONSUMER.CREATE.DICOM_EVENTS.manager-updated.>"
              "$JS.API.CONSUMER.DURABLE.CREATE.DICOM_EVENTS.manager-updated"
              "$JS.API.CONSUMER.INFO.DICOM_EVENTS.manager-updated"
              "$JS.API.CONSUMER.MSG.NEXT.DICOM_EVENTS.manager-updated"
              "$JS.ACK.DICOM_EVENTS.manager-updated.>"
              "$JS.API.CONSUMER.CREATE.DICOM_EVENTS.manager-failed"
              "$JS.API.CONSUMER.CREATE.DICOM_EVENTS.manager-failed.>"
              "$JS.API.CONSUMER.DURABLE.CREATE.DICOM_EVENTS.manager-failed"
              "$JS.API.CONSUMER.INFO.DICOM_EVENTS.manager-failed"
              "$JS.API.CONSUMER.MSG.NEXT.DICOM_EVENTS.manager-failed"
              "$JS.ACK.DICOM_EVENTS.manager-failed.>"
            ]
          }
          subscribe {
            allow: [
              "dicom.document.updated"
              "dicom.document.failed"
              "_INBOX.>"
            ]
          }
        }
      }

      {
        user: dicom-analyzer
        password: $DICOM_ANALYZER_PASSWORD
        permissions {
          publish {
            allow: [
              "$JS.API.STREAM.CREATE.DICOM_EVENTS"
              "$JS.API.STREAM.INFO.DICOM_EVENTS"
              "$JS.API.CONSUMER.CREATE.DICOM_EVENTS.analyzer-requests"
              "$JS.API.CONSUMER.CREATE.DICOM_EVENTS.analyzer-requests.>"
              "$JS.API.CONSUMER.DURABLE.CREATE.DICOM_EVENTS.analyzer-requests"
              "$JS.API.CONSUMER.INFO.DICOM_EVENTS.analyzer-requests"
              "$JS.API.CONSUMER.MSG.NEXT.DICOM_EVENTS.analyzer-requests"
              "$JS.ACK.DICOM_EVENTS.analyzer-requests.>"
              "dicom.analysis.completed"
              "dicom.analysis.failed"
            ]
          }
          subscribe {
            allow: [
              "dicom.analysis.requested"
              "_INBOX.>"
            ]
          }
        }
      }
    ]
  }
}


# ============================================================
# JetStream
# ============================================================

jetstream {
  store_dir: /data
}
