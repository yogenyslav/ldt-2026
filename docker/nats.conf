# ============================================================
# General
# ============================================================

port: 4222
http: 0.0.0.0:8222


# ============================================================
# Cluster
# ============================================================

cluster {
  name: c1
  listen: 0.0.0.0:6222

  authorization {
    user: nats-route
    password: $NATS_ROUTE_PASSWORD
  }

  routes: [
    nats://nats-route:<need-real-password-here>@nats-1:6222
    nats://nats-route:<need-real-password-here>@nats-2:6222
    nats://nats-route:<need-real-password-here>@nats-3:6222
  ]
}


# ============================================================
# Accounts
# ============================================================

accounts {
  $SYS {
    users: [
      {
        user: sys
        password: $NATS_SYS_PASSWORD
      }
    ]
  }

  DICOM {
    users: [
      {
          user: dicom-worker
          password: $DICOM_WORKER_PASSWORD
          permissions {
            publish {
              allow: [
                "dicom.analysis.requested"
              ]
            }
            subscribe {
              allow: [
                "dicom.analysis.completed"
                "_INBOX.>"
              ]
            }
          }
        }

      {
        user: dicom-analyzer
        password: $DICOM_ANALYZER_PASSWORD
        permissions {
          publish {
            allow: [
              "dicom.analysis.completed"
            ]
          }
          subscribe {
            allow: [
              "dicom.analysis.requested"
              "_INBOX.>"
            ]
          }
        }
      }
    ]
  }
}


# ============================================================
# JetStream
# ============================================================

jetstream {
  store_dir: /data
}
