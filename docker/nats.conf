# ============================================================
# General
# ============================================================

port: 4222
http: 0.0.0.0:8222


# ============================================================
# Cluster
# ============================================================

cluster {
  name: c1
  listen: 0.0.0.0:6222

  authorization {
    user: nats-route
    password: "${NATS_ROUTE_PASSWORD}"
  }

  routes: [
    nats://nats-route:${NATS_ROUTE_PASSWORD}@nats-1:6222
    nats://nats-route:${NATS_ROUTE_PASSWORD}@nats-2:6222
    nats://nats-route:${NATS_ROUTE_PASSWORD}@nats-3:6222
  ]
}


# ============================================================
# Accounts
# ============================================================

accounts {
  $SYS {
    users: [
      {
        user: sys
        password: "${NATS_SYS_PASSWORD}"
      }
    ]
  }

  DICOM {
    users: [
      {
          user: dicom-worker
          password: "${DICOM_WORKER_PASSWORD}"
          permissions {
            publish {
              allow: [
                "dicom.analysis.requested"
              ]
            }
            subscribe {
              allow: [
                "dicom.analysis.completed"
                "_INBOX.>"
              ]
            }
          }
        }

      {
        user: dicom-analyzer
        password: "${DICOM_ANALYZER_PASSWORD}"
        permissions {
          publish {
            allow: [
              "dicom.analysis.completed"
            ]
          }
          subscribe {
            allow: [
              "dicom.analysis.requested"
              "_INBOX.>"
            ]
          }
        }
      }
    ]
  }
}


# ============================================================
# System account
# ============================================================

system_account: $SYS


# ============================================================
# JetStream
# ============================================================

jetstream {
  store_dir: /data
}
