name: dicom-storage

services:
  reports:
    container_name: reports
    image: quay.io/minio/minio:latest
    environment:
      - MINIO_ROOT_USER=${S3_USER:-minio}
      - MINIO_ROOT_PASSWORD=${S3_PASSWORD:-minio123}
    restart: unless-stopped
    ports:
      - "9010:9000"
      - "9011:9001"
    command: server /data --console-address ":9001"
    networks:
      - dicom-network
    volumes:
      - reports_data:/data

volumes:
  reports_data:

networks:
  dicom-network:
    external: true
