name: dicom-storage

services:
  raw-dicom:
    container_name: raw-dicom
    image: quay.io/minio/minio:latest
    environment:
      - MINIO_ROOT_USER=${S3_USER:-minio}
      - MINIO_ROOT_PASSWORD=${S3_PASSWORD:-minio123}
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - raw_dicom_data:/data

  reports:
    container_name: reports
    image: quay.io/minio/minio:latest
    environment:
      - MINIO_ROOT_USER=${S3_USER:-minio}
      - MINIO_ROOT_PASSWORD=${S3_PASSWORD:-minio123}
    restart: unless-stopped
    ports:
      - "9010:9000"
      - "9011:9001"
    command: server /data --console-address ":9001"
    volumes:
      - reports_data:/data

volumes:
  raw_dicom_data:
  reports_data:
