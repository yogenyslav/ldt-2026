upstream dicom_backend {
    zone dicom_backend 64k;
    server dicom-manager:10000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 500m;

    location /api/ {
        proxy_pass http://dicom-manager:10000/;
        proxy_read_timeout 300s;
    }

    # single-page app: every route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
