resolver 127.0.0.11 valid=10s ipv6=off;

upstream dicom_backend {
    zone dicom_backend 64k;
    server dicom-manager:10000 resolve;
}

upstream report_storage {
    zone report_storage 64k;
    server reports:9000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 500m;

    location /api/ {
        proxy_pass http://dicom_backend/;
        proxy_read_timeout 300s;
    }

    location ^~ /report-files/ {
        proxy_pass http://report_storage/;
        # The original S3 host is part of the presigned URL signature.
        proxy_set_header Host reports:9000;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
