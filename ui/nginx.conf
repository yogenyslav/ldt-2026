server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # одностраничное приложение: любой маршрут отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
